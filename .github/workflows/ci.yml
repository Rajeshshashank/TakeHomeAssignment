name: ci

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reproduce every reported number
        run: bash scripts/run_all.sh
      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements
          path: |
            project_a/tests/cases/measurement.json
            project_a/tests/cases/official_calculator_checks.json
            project_a/tests/cases/spec_diff.json
            project_b/results/measurement.json
            project_b/results/raw_profile.json
