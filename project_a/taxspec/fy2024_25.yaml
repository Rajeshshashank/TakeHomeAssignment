# Income-tax parameters for salaried individuals, FY 2024-25 (AY 2025-26).
# Every value carries a `cite` so that each rupee in an answer can be traced to
# a clause. Values are taken from the Income Tax Department's published rates
# and the Finance (No. 2) Act, 2024.
meta:
  fy: "2024-25"
  ay: "2025-26"
  currency: INR
  sources:
    - "Income Tax Department, 'Income Tax Slabs & Rates FY 2024-25 (AY 2025-26)'"
    - "Finance (No. 2) Act, 2024"
    - "Income Tax Act, 1961, ss. 87A, 115BAC, 288A, 288B"
  # Sections 288A / 288B: round total income down to the nearest 10, then
  # round the tax payable to the nearest 10.
  rounding:
    total_income: floor10
    tax_payable: round10

# Chapter II, First Schedule, Part I (old regime) and s.115BAC(1A) (new regime).
slabs:
  old:
    cite: "Finance (No. 2) Act 2024, First Schedule Part I; s.115BAC opt-out"
    brackets:
      - {upto: 250000, rate: 0.00}
      - {upto: 500000, rate: 0.05}
      - {upto: 1000000, rate: 0.20}
      - {upto: null, rate: 0.30}
    # Additional basic exemption for senior / very-senior citizens (old regime).
    senior_brackets:
      - {upto: 300000, rate: 0.00}
      - {upto: 500000, rate: 0.05}
      - {upto: 1000000, rate: 0.20}
      - {upto: null, rate: 0.30}
    super_senior_brackets:
      - {upto: 500000, rate: 0.00}
      - {upto: 1000000, rate: 0.20}
      - {upto: null, rate: 0.30}
  new:
    cite: "s.115BAC(1A) as amended by Finance (No. 2) Act 2024"
    brackets:
      - {upto: 300000, rate: 0.00}
      - {upto: 700000, rate: 0.05}
      - {upto: 1000000, rate: 0.10}
      - {upto: 1200000, rate: 0.15}
      - {upto: 1500000, rate: 0.20}
      - {upto: null, rate: 0.30}

standard_deduction:
  cite: "s.16(ia)"
  old: 50000
  new: 75000

# Section 87A rebate: available only when total income is at or below the
# threshold, and capped at `max_rebate`.
rebate_87a:
  cite: "s.87A; s.87A(2) proviso"
  old:
    threshold_total_income: 500000
    max_rebate: 12500
    # Marginal relief at the threshold: tax cannot exceed income above 5,00,000.
    marginal_relief: true
  new:
    threshold_total_income: 700000
    max_rebate: 25000
    marginal_relief: true

# Surcharge on tax (before cess). The 37% band applies only to the old regime;
# s.115BAC(1A) caps the new-regime surcharge at 25%.
surcharge:
  cite: "Finance Act 2024, First Schedule; s.2 proviso to Part I; s.115BAC(1A) proviso"
  bands:
    - {above: 5000000, rate: 0.10}
    - {above: 10000000, rate: 0.15}
    - {above: 20000000, rate: 0.25}
    - {above: 50000000, rate: 0.37}
  new_regime_max_rate: 0.25
  marginal_relief: true

cess_rate:
  value: 0.04
  cite: "Finance Act 2018, s.2; Health and Education Cess at 4%"

# Statutory caps on the deductions in scope.
caps:
  sec_80c: {value: 150000, cite: "s.80C(1) read with s.80CCE"}
  sec_80ccd_1b: {value: 50000, cite: "s.80CCD(1B)"}
  sec_80d:
    self_below_60: {value: 25000, cite: "s.80D(2)"}
    self_60_plus: {value: 50000, cite: "s.80D(2) proviso"}
    parents_below_60: {value: 25000, cite: "s.80D(2)(b)"}
    parents_60_plus: {value: 50000, cite: "s.80D(2)(b) proviso"}
  sec_24b_self_occupied: {value: 200000, cite: "s.24(b)"}
  professional_tax: {value: 2500, cite: "s.16(iii)"}

hra_exemption:
  cite: "s.10(13A) read with Rule 2A"
  method: min_of_three
  # Exemption = least of (actual HRA, rent - 10% of salary, 40%/50% of salary).
  components:
    - actual_hra_received
    - rent_paid_minus_10pct_salary
    - pct_of_salary
  pct_of_salary:
    metro: 0.50
    non_metro: 0.40
  # 'Salary' for Rule 2A means basic + dearness allowance forming part of
  # retirement benefits (+ commission as a fixed percentage of turnover).
  salary_basis: [basic, dearness_allowance]

# Deductions that the new regime (s.115BAC) disallows.
regime_allowed_deductions:
  old: [hra, sec_80c, sec_80ccd_1b, sec_80d, sec_24b, professional_tax]
  new: []
